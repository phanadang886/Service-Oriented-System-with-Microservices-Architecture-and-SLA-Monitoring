services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

# ---------------------------------------------------------
  # Services
  # All four currently run the shared stub image.
  # When a service gets its own code, change its build context
  # to ./services/<name> and keep the rest of the block.
  # ---------------------------------------------------------
  auth-service:
    build:
      context: ./services/_template
    environment:
      SERVICE_NAME: auth
      SERVICE_PORT: "8001"
      SERVICE_PREFIX: "/api/auth"
      AUTH_DB_URL: ${AUTH_DB_URL}
      JWT_SECRET: ${JWT_SECRET}
    # No ports mapping: services are reached through the gateway only.
    # A fixed host port would block scaling this service later.
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ['SERVICE_PORT']+'/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  catalog-service:
    build:
      context: ./services/_template
    environment:
      SERVICE_NAME: catalog
      SERVICE_PORT: "8002"
      SERVICE_PREFIX: "/api/catalog"
      CATALOG_DB_URL: ${CATALOG_DB_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ['SERVICE_PORT']+'/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  booking-service:
    build:
      context: ./services/_template
    environment:
      SERVICE_NAME: booking
      SERVICE_PORT: "8003"
      SERVICE_PREFIX: "/api/booking"
      BOOKING_DB_URL: ${BOOKING_DB_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ['SERVICE_PORT']+'/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    # No container_name - this is the service scaled in week 4

  notification-service:
    build:
      context: ./services/_template
    environment:
      SERVICE_NAME: notification
      SERVICE_PORT: "8004"
      SERVICE_PREFIX: "/api/notification"
      NOTIFICATION_DB_URL: ${NOTIFICATION_DB_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ['SERVICE_PORT']+'/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------
  # Gateway
  # ---------------------------------------------------------
  nginx:
    image: nginx:alpine
    ports:
      - "${GATEWAY_PORT}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - catalog-service
      - booking-service
      - notification-service
    restart: unless-stopped

  # ---------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    depends_on:
      - nginx
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    
volumes:
  pg-data:
  prom-data:
  grafana-data: