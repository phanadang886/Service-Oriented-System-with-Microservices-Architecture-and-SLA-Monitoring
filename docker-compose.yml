services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Volume name kept as pg-data so existing local data survives.
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

# ---------------------------------------------------------
  # Services
  # Build context is the repository root because each service
  # imports the shared package from services/common.
  # No host port mapping: every service is reached through the
  # gateway only. A fixed host port would block --scale.
  # ---------------------------------------------------------
  auth-service:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      AUTH_SERVICE_PORT: "8001"
      ALEMBIC_CONFIG: /workspace/services/auth/alembic.ini
      ALEMBIC_DB_HOST: postgres
      AUTH_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AUTH_DB_NAME}
      JWT_SECRET_KEY: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    environment:
      CATALOG_SERVICE_PORT: "8002"
      ALEMBIC_CONFIG: /workspace/services/catalog/alembic.ini
      ALEMBIC_DB_HOST: postgres
      CATALOG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${CATALOG_DB_NAME}
      REDIS_URL: ${REDIS_URL}
      CATALOG_CACHE_TTL_SECONDS: ${CATALOG_CACHE_TTL_SECONDS}
      JWT_SECRET_KEY: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  booking-service:
    build:
      context: .
      dockerfile: services/booking/Dockerfile
    environment:
      BOOKING_SERVICE_PORT: "8003"
      ALEMBIC_CONFIG: /workspace/services/booking/alembic.ini
      ALEMBIC_DB_HOST: postgres
      BOOKING_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${BOOKING_DB_NAME}
      REDIS_URL: ${REDIS_URL}
      BOOKING_EVENTS_STREAM: ${BOOKING_EVENTS_STREAM}
      JWT_SECRET_KEY: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8003/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # No container_name - this is the service scaled in week 4

  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      NOTIFICATION_SERVICE_PORT: "8004"
      ALEMBIC_CONFIG: ""
      NOTIFICATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${NOTIFICATION_DB_NAME}
      REDIS_URL: ${REDIS_URL}
      BOOKING_EVENTS_STREAM: ${BOOKING_EVENTS_STREAM}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8004/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------
  # Gateway
  # ---------------------------------------------------------
  api-gateway:
    image: nginx:alpine
    ports:
      - "${GATEWAY_PORT}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth-service: { condition: service_healthy }
      catalog-service: { condition: service_healthy }
      booking-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
    restart: unless-stopped

  # ---------------------------------------------------------
  # Frontend (static build served by its own nginx)
  # ---------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

  # ---------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION}"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    depends_on:
      - api-gateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  prom-data:
  grafana-data:
