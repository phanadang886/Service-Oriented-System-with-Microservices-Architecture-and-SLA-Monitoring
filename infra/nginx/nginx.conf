# ============================================================
# API Gateway
#
# Why "resolver" is required here:
#
# nginx resolves a hostname written directly in proxy_pass ONCE, at
# startup, and then keeps that IP forever. Every time a container is
# recreated (restart, rebuild, or --scale) it gets a new IP, so nginx
# keeps calling the dead one and returns 502 Bad Gateway.
#
# Two changes fix that:
#   1. resolver 127.0.0.11  -> Docker's embedded DNS, re-queried on
#      every request thanks to the 10s TTL
#   2. proxy_pass uses a variable -> nginx must resolve at request time
#
# The path is forwarded UNCHANGED: each service mounts its routes under
# /api/<service> (see the routers), so no rewrite is needed.
# Because the name is resolved per request, scaling a service works
# automatically: Docker DNS returns every replica and nginx balances
# between them.
# ============================================================

# Rate limiting: 50 requests/second per IP, small burst allowed.
# limit_req_zone is an http-context directive, so it must stay outside the
# server block. This file is included inside nginx's http context, so a
# top-level directive here lands in http.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

server {
    listen 80;

    # Docker's embedded DNS server.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # CORS for the React frontend.
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Request-ID' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,X-Request-ID' always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    limit_req zone=api_limit burst=20 nodelay;

    # Health of the gateway itself
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    location /api/auth/ {
        set $upstream auth-service:8001;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward the request id so one id can be traced through
        # every service in the logs.
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    location /api/catalog/ {
        set $upstream catalog-service:8002;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    location /api/booking/ {
        set $upstream booking-service:8003;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
    }

    location /api/notification/ {
        set $upstream notification-service:8004;
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
    }
}
