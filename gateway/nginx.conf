events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Rate limiting: 50 requests/second per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # Định dạng log kèm X-Request-ID
    log_format main '[$time_local] $remote_addr - $request_id "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    upstream auth_service {
        server auth-service:8001;
    }

    upstream catalog_service {
        server catalog-service:8002;
    }

    upstream booking_service {
        server booking-service:8003;
    }

    upstream notification_service {
        server notification-service:8004;
    }

    server {
        listen 80;
        server_name localhost;

        # Cấu hình CORS chung cho Frontend gọi API
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Request-ID' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,X-Request-ID' always;

        # Xử lý preflight request OPTIONS
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Truyền Request ID xuống microservices
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Áp dụng rate limiting
        limit_req zone=api_limit burst=20 nodelay;

        location /api/auth/ {
            proxy_pass http://auth_service/api/auth/;
        }

        location /api/catalog/ {
            proxy_pass http://catalog_service/api/catalog/;
        }

        location /api/booking/ {
            proxy_pass http://booking_service/api/booking/;
        }

        location /api/notification/ {
            proxy_pass http://notification_service/api/notification/;
        }

        location /health {
            return 200 '{"status":"healthy","service":"api-gateway"}';
            add_header Content-Type application/json;
        }
    }
}
